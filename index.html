<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sophy">
  <title>Sophy</title>
  <link rel="icon" type="image/png" href="Sophya.png">
  <link rel="apple-touch-icon" href="Sophya.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <script>
    // Marca que cambia cada 5 minutos: evita que el navegador siga usando una versión antigua de la web.
    window.VERSION = Math.floor(Date.now() / 300000);
    document.write('<link rel="stylesheet" href="styles.css?v=' + window.VERSION + '">');
  </script>
</head>
<body class="sin-sesion">
  <header class="cabecera" id="cabecera">
    <div class="cabecera-fila">
      <a class="marca" href="#/" aria-label="Sophy, inicio">
        <img id="icono" class="marca-icono" src="Sophya.png" alt="" width="38" height="38">
        <span class="marca-nombre">Sophy</span>
      </a>
      <nav id="secciones" class="secciones" aria-label="Secciones"></nav>
      <div class="cabecera-acciones">
        <a id="racha" class="racha" href="#/historial" hidden></a>
        <button id="abrir-menu" class="hamburguesa" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div id="lectura-barra" class="lectura-barra"></div>
  </header>

  <div id="velo" class="velo"></div>
  <aside id="menu" class="menu" aria-label="Menú" aria-hidden="true">
    <button id="cerrar-menu" class="menu-cerrar" aria-label="Cerrar menú"></button>
    <nav class="menu-enlaces">
      <div class="menu-grupo">
        <a href="#/biblioteca">Biblioteca</a>
        <div class="menu-sub"><div id="menu-biblioteca" class="menu-sub-dentro"></div></div>
      </div>
      <a href="#/usuario">Usuario</a>
      <a href="#/historial">Historial</a>
      <a href="#/friends">Friends</a>
      <a href="#/about">About Us</a>
    </nav>
    <div class="menu-pie">
      <span id="menu-correo"></span>
      <button id="salir" class="menu-salir" hidden>Cerrar sesión</button>
    </div>
  </aside>

  <main id="vista" class="vista"></main>

  <footer class="pie">
    <span class="pie-marca">Sophy</span>
    <span>Aprender, cada día.</span>
    <a href="#/about">About Us</a>
  </footer>

  <div id="aviso-dia" class="aviso-dia" role="status"></div>
  <canvas id="confeti" class="confeti" aria-hidden="true"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.write('<script src="config.js?v=' + window.VERSION + '"><\/script><script src="app.js?v=' + window.VERSION + '"><\/script>');
  </script>
</body>
</html>
